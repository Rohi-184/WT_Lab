<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #4d8fec 0%, #072a66 100%);
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 95%;
        max-width: 900px;
      }

      .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 18px;
        align-items: start;
      }

      .col-span-2 {
        grid-column: 1 / -1;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .input-group {
        margin-bottom: 0;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
      }

      textarea {
        resize: none;
        height: 100px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        background: #667eea;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #072a66;
      }

      .thank {
        display: none;
        text-align: center;
      }

      .thank p {
        color: #555;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section id="formSection" class="card">
        <h1>Job Application Form</h1>

        <form id="jobForm" enctype="multipart/form-data">
          <div class="form-grid">
            <div class="input-group">
              <label>Name</label>
              <input type="text" placeholder="Enter your name" required />
            </div>

            <div class="input-group">
              <label>Email</label>
              <input type="email" placeholder="Enter your email" required />
            </div>

            <div class="input-group">
              <label>Phone</label>
              <input type="tel" placeholder="Enter phone number" required />
            </div>

            <div class="input-group">
              <label>Age</label>
              <input
                type="number"
                min="16"
                max="100"
                placeholder="Enter your age"
                required
              />
            </div>

            <div class="input-group">
              <label>Years of Experience</label>
              <input
                type="number"
                min="0"
                max="50"
                placeholder="e.g. 3"
                required
              />
            </div>

            <div class="input-group">
              <label>Education</label>
              <select required>
                <option value="">Select Education</option>
                <option>Bachelor's</option>
                <option>Master's</option>
                <option>PhD</option>
                <option>Diploma / Other</option>
              </select>
            </div>

            <div class="input-group col-span-2">
              <label>Position Applied For</label>
              <select required>
                <option value="">Select Position</option>
                <option>Frontend Developer</option>
                <option>Backend Developer</option>
                <option>UI Designer</option>
              </select>
            </div>

            <div class="input-group col-span-2">
              <label>Cover Letter</label>
              <textarea placeholder="Write something about yourself"></textarea>
            </div>

            <div class="input-group">
              <label>Resume (PDF / DOC)</label>
              <input type="file" accept=".pdf,.doc,.docx" required />
            </div>

            <div class="input-group">
              <label>LinkedIn Profile</label>
              <input
                type="text"
                placeholder="https://www.linkedin.com/in/yourname"
              />
            </div>

            <div class="input-group col-span-2">
              <label>Portfolio URL</label>
              <input type=" " placeholder="https://yourportfolio.com" />
            </div>

            <div class="input-group col-span-2">
              <button type="submit">Submit Application</button>
            </div>
          </div>
        </form>
      </section>

      <section id="thankSection" class="card thank">
        <h1>🎉 Thank You!</h1>
        <p>
          Your job application has been submitted successfully. We will contact
          you soon.
        </p>
        <div style="margin-top:18px;">
          <button id="backBtn" type="button">Back to Form</button>
        </div>
      </section>
    </div>

    <script>
      const form = document.getElementById("jobForm");

      const formSection = document.getElementById("formSection");
      const thankSection = document.getElementById("thankSection");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        formSection.style.display = "none";
        thankSection.style.display = "block";
      });

      const backBtn = document.getElementById("backBtn");
      if (backBtn) {
        backBtn.addEventListener("click", function () {
          thankSection.style.display = "none";
          formSection.style.display = "block";
          form.reset();
        });
      }
    </script>
  </body>
</html>
