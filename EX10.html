<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canara Bank Account Application</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff8e7 0%, #f6d365 48%, #c62828 100%);
            color: #2d201b;
        }

        header,
        footer {
            text-align: center;
            background: #8f1d2c;
            color: white;
            padding: 12px 20px;
            box-shadow: 0 5px 16px rgba(76, 18, 27, 0.25);
        }

        header h1 {
            margin: 0;
            letter-spacing: 1px;
        }

        header p {
            margin: 4px 0 0;
            color: #ffe5a8;
            font-size: 13px;
        }

        .container {
            width: min(92%, 1000px);
            margin: 12px auto;
            background: rgba(255, 255, 255, 0.96);
            padding: 18px 24px;
            border-radius: 14px;
            box-shadow: 0 18px 45px rgba(81, 35, 13, 0.24);
        }

        h2 {
            text-align: center;
            color: #8f1d2c;
            margin: 0 0 10px;
            font-size: 22px;
        }

        h3 {
            background: #fff1cf;
            border-left: 5px solid #d39b19;
            color: #7d1726;
            margin: 12px 0 8px;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 15px;
        }

        label {
            font-weight: 600;
            color: #56352b;
        }

        label input {
            margin-top: 7px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 16px;
        }

        .address-grid,
        .account-grid,
        .nominee-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 16px;
        }

        input:not([type="checkbox"]),
        select {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #d8c8b2;
            border-radius: 6px;
            background: #fffdf8;
            color: #2d201b;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:not([type="checkbox"]):focus,
        select:focus {
            outline: none;
            border-color: #c62828;
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.14);
        }

        .full-width {
            margin-bottom: 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        button {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(76, 18, 27, 0.2);
        }

        button[type="submit"] {
            background: #c62828;
        }

        button[type="reset"] {
            background: #806b5d;
        }

        #result {
            font-weight: 700;
            text-align: center;
        }

        footer {
            padding: 8px 20px;
            font-size: 12px;
        }

        @media (max-width: 640px) {
            .container {
                width: 82%;
                padding: 24px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .address-grid,
            .account-grid,
            .nominee-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Canara Bank</h1>
        <p>Trusted banking for every milestone</p>
    </header>

    <div class="container">
        <h2>New Account Application</h2>

        <form id="bankForm">
            <h3>1. Personal Details</h3>

            <div class="grid">
                <label>
                    Full Name
                    <input type="text" id="name">
                </label>

                <label>
                    Date of Birth
                    <input type="date" id="dob">
                </label>

                <label>
                    Mobile Number
                    <input type="tel" id="mobile">
                </label>

                <label>
                    Email
                    <input type="email" id="email">
                </label>

                <label>
                    PAN
                    <input type="text" id="pan">
                </label>

                <label>
                    Aadhaar Number
                    <input type="text" id="aadhaar">
                </label>
            </div>

            <h3>2. Residential Address</h3>

            <div class="address-grid">
                <input class="full-width" type="text" id="address" placeholder="Address">
                <input class="full-width" type="text" id="city" placeholder="City">
                <input class="full-width" type="text" id="state" placeholder="State">
                <input class="full-width" type="text" id="pincode" placeholder="Pin Code">
            </div>

            <h3>3. Account Details</h3>

            <div class="account-grid">
                <select class="full-width" id="account">
                    <option value="">Select Account Type</option>
                    <option value="Savings Account">Savings Account</option>
                    <option value="Current Account">Current Account</option>
                </select>
                <input class="full-width" type="number" id="deposit" placeholder="Initial Deposit">
            </div>

            <h3>4. Nominee Details</h3>

            <div class="nominee-grid">
                <input class="full-width" type="text" id="nominee" placeholder="Nominee Name">
                <input class="full-width" type="text" id="relationship" placeholder="Relationship">
            </div>

            <h3>5. Declaration</h3>

            <label>
                <input type="checkbox" id="declaration">
                I confirm that the entered information is correct.
            </label>

            <div class="actions">
                <button type="submit">Submit Application</button>
                <button type="reset">Clear Form</button>
            </div>

            <p id="result"></p>
        </form>
    </div>

    <footer>
        Canara Bank - Account Application
    </footer>

    <script>
        document.getElementById("bankForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                let requiredFields = [
                    "name", "dob", "mobile", "email", "pan", "aadhaar",
                    "address", "city", "state", "pincode", "account",
                    "deposit", "nominee", "relationship"
                ];

                for (let id of requiredFields) {
                    if (document.getElementById(id).value.trim() === "") {
                        alert("Please fill all required fields");
                        return;
                    }
                }

                if (!document.getElementById("declaration").checked) {
                    alert("Please confirm the declaration");
                    return;
                }

                document.getElementById("result").innerHTML =
                    "Application submitted successfully!";
                document.getElementById("result").style.color = "green";
            });
    </script>
</body>

</html>
