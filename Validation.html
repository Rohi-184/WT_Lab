<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        h2 {
            text-align: center;
            color: #1f2937;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            background-color: #f9fafb;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
            filter: brightness(1.05);
        }

        button:active {
            transform: translateY(0);
        }
    </style>

    <script>
        function validateForm() {

            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var age = document.getElementById("age").value;
            var city = document.getElementById("city").value;
            var pincode = document.getElementById("pincode").value;
            var password = document.getElementById("password").value;

            // Empty validation
            if (name == "") {
                alert("Name textbox is empty!");
                return false;
            }

            if (email == "") {
                alert("Email textbox is empty!");
                return false;
            }

            if (phone == "") {
                alert("Phone Number textbox is empty!");
                return false;
            }

            if (age == "") {
                alert("Age textbox is empty!");
                return false;
            }

            if (city == "") {
                alert("City textbox is empty!");
                return false;
            }

            if (pincode == "") {
                alert("Pincode textbox is empty!");
                return false;
            }

            if (password == "") {
                alert("Password textbox is empty!");
                return false;
            }

            // Name validation
            if (!isNaN(name)) {
                alert("Invalid Name! Please enter only letters.");
                return false;
            }

            // Email validation
            if (email.indexOf("@") == -1) {
                alert("Invalid Email! Please enter @ symbol.");
                return false;
            }

            // Phone validation
            if (isNaN(phone)) {
                alert("Invalid Phone Number! Only numbers are allowed.");
                return false;
            }

            if (phone.length != 10) {
                alert("Phone Number must contain 10 digits!");
                return false;
            }

            // Age validation
            if (isNaN(age)) {
                alert("Invalid Age! Only numbers are allowed.");
                return false;
            }

            // Pincode validation
            if (isNaN(pincode)) {
                alert("Invalid Pincode! Only numbers are allowed.");
                return false;
            }

            if (pincode.length != 6) {
                alert("Pincode must contain 6 digits!");
                return false;
            }

            // Password validation
            if (password.length < 6) {
                alert("Password must contain at least 6 characters!");
                return false;
            }

            alert("Form submitted successfully!");
            return true;
        }
    </script>
</head>

<body>

<div class="container">
    <h2>Form Validation</h2>

    <form onsubmit="return validateForm()">
        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number">
        </div>

        <div class="input-group">
            <label for="age">Age</label>
            <input type="text" id="age" placeholder="Enter your age">
        </div>

        <div class="input-group">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="Enter your city">
        </div>

        <div class="input-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" placeholder="Enter your pincode">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
